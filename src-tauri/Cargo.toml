[package]
name = "solution-bat-next"
version = "0.1.0"
description = "Unreal Engine and TypeScript build workspace manager"
authors = ["sharkgao"]
edition = "2021"
rust-version = "1.77.2"
default-run = "solution-bat-next"

[lib]
name = "solution_bat_next_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
encoding_rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
lto = false
codegen-units = 16
strip = true
